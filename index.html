<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XXX學校 QRcode簽到點名系統</title>
  <!-- 引入 QR Code 掃描套件 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      background-color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }
    .top-bar h1 { margin: 0; font-size: 1.25rem; }
    .btn {
      padding: 6px 12px;
      font-size: 0.95rem;
      color: #fff;
      background-color: #0d6efd;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-secondary { background-color: #198754; }
    .btn-info { background-color: #0dcaf0; color: #000; }
    .content-area {
      margin-top: 20px;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }
    #status {
      font-weight: bold;
      color: #0d6efd;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>XXX學校 QRcode簽到點名系統</h1>
    <div>
      <button class="btn" onclick="showSection('sendMail')">發出點名信</button>
      <button class="btn btn-secondary" onclick="startScanner()">學生簽到 (開鏡頭)</button>
      <button class="btn btn-info" onclick="showSection('query')">查詢出缺席</button>
    </div>
  </div>

  <div class="content-area" id="mainContent">
    <h3>學生簽到區</h3>
    <div id="reader"></div>
    <div id="status">準備中，請點擊「學生簽到」開啟相機...</div>
  </div>

  <script>
    // ⚠️ 請將引號內的網址替換為您的 Google Apps Script Web App 部署網址 ⚠️
    const GAS_WEB_APP_URL = "https://script.google.com/a/macros/kssh.khc.edu.tw/s/AKfycbxoarp_kI4R4aEIBPxKHbJninUhQr5L5_QSftPW4Imz7gAGTcazfJJb-R7Dl9xfREcjsw/exec"; 
    let html5QrcodeScanner;

    function startScanner() {
      document.getElementById('status').innerText = "開啟攝影機中，請允許相機存取權限...";
      
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      }
      
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText, decodedResult) {
      document.getElementById('status').innerText = `掃描成功！內容：${decodedText}，正在傳送至試算表...`;
      
      // 停止掃描
      html5QrcodeScanner.clear();

      // 發送資料給 Google Apps Script 寫入試算表
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qrData: decodedText })
      })
      .then(() => {
        document.getElementById('status').innerText = `✅ 簽到成功！內容：${decodedText}`;
      })
      .catch(error => {
        document.getElementById('status').innerText = `❌ 簽到傳送失敗：${error}`;
      });
    }

    function onScanFailure(error) {
      // 掃描過程中持續搜尋
    }

    function showSection(name) {
      if (html5QrcodeScanner) html5QrcodeScanner.clear();
      document.getElementById('mainContent').innerHTML = `<h3>${name}</h3><p>此功能開發中...</p>`;
    }
  </script>
</body>
</html>
