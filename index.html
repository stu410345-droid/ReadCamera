<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XXX學校 QRcode簽到點名系統</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background-color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }
    .top-bar h1 { margin: 0; font-size: 1.25rem; color: #333; }
    .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 6px 12px;
      font-size: 0.9rem;
      color: #fff;
      background-color: #0d6efd;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-secondary { background-color: #198754; }
    .btn-info { background-color: #0dcaf0; color: #000; }
    .content-area {
      margin-top: 20px;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      min-height: 250px;
    }
    #reader { width: 100%; max-width: 450px; margin: 15px auto; }
    #status { font-weight: bold; color: #0d6efd; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>XXX學校 QRcode簽到點名系統</h1>
    <div class="button-group">
      <button class="btn" onclick="showSection('發出點名信')">發出點名信</button>
      <button class="btn btn-secondary" onclick="startScanner()">學生簽到 (開鏡頭)</button>
      <button class="btn btn-info" onclick="showSection('查詢出缺席')">查詢出缺席</button>
    </div>
  </div>

  <div class="content-area" id="mainContent">
    <h3>學生簽到區</h3>
    <div id="reader"></div>
    <div id="status">準備中，請點擊「學生簽到」開啟相機...</div>
  </div>

  <script>
    // 請替換為您發布的 GAS Web App URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"; 
    let html5QrcodeScanner;

    function startScanner() {
      const contentDiv = document.getElementById('mainContent');
      contentDiv.innerHTML = `
        <h3>學生簽到 (鏡頭掃描)</h3>
        <div id="status">開啟攝影機中，請允許相機權限...</div>
        <div id="reader"></div>
      `;

      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText) {
      document.getElementById('status').innerText = `掃描成功！內容：${decodedText}，正在傳送至試算表...`;
      
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }

      const formData = new URLSearchParams();
      formData.append('qrData', decodedText);

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      })
      .then(() => {
        document.getElementById('status').innerText = `✅ 簽到成功！內容：${decodedText}`;
      })
      .catch(error => {
        document.getElementById('status').innerText = `❌ 傳送失敗：${error}`;
      });
    }

    function onScanFailure(error) {
      // 掃描尋找中
    }

    function showSection(name) {
      if (html5QrcodeScanner) html5QrcodeScanner.clear();
      document.getElementById('mainContent').innerHTML = `<h3>${name}</h3><p>此功能開發中...</p>`;
    }
  </script>
</body>
</html>
