<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XXX學校 QRcode簽到點名系統</title>
  <!-- 引入 QR Code 掃描套件 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background-color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }
    .top-bar h1 {
      margin: 0;
      font-size: 1.25rem;
      color: #333;
    }
    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 6px 12px;
      font-size: 0.9rem;
      color: #fff;
      background-color: #0d6efd;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-secondary { background-color: #198754; }
    .btn-info { background-color: #0dcaf0; color: #000; }
    .content-area {
      margin-top: 20px;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      min-height: 250px;
    }
    #reader {
      width: 100%;
      max-width: 450px;
      margin: 15px auto;
    }
    #status {
      font-weight: bold;
      color: #0d6efd;
      margin-top: 10px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <!-- 頂部橫幅區塊 -->
  <div class="top-bar">
    <h1>XXX學校 QRcode簽到點名系統</h1>
    <div class="button-group">
      <button class="btn" onclick="showSection('發出點名信')">發出點名信</button>
      <button class="btn btn-secondary" onclick="startScanner()">學生簽到 (開鏡頭)</button>
      <button class="btn btn-info" onclick="showSection('查詢出缺席')">查詢出缺席</button>
    </div>
  </div>

  <!-- 主要內容顯示區 -->
  <div class="content-area" id="mainContent">
    <h3>學生簽到區</h3>
    <div id="reader"></div>
    <div id="status">準備就緒！請點擊「學生簽到 (開鏡頭)」開始進行點名。</div>
  </div>

  <script>
    // ⚠️ 請替換為您重新部署後的 Google Apps Script Web App 網址 ⚠️
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz-cnD3bMZlcMqfB1jLsa7aC3bRjsHukdTW2XjKUAVa6Gs5CgEnyoHyV5oCR0Xm0xm2/exec"; 

    let html5QrcodeScanner;

    // 開啟鏡頭掃描
    function startScanner() {
      const contentDiv = document.getElementById('mainContent');
      contentDiv.innerHTML = `
        <h3>學生簽到 (鏡頭掃描)</h3>
        <div id="status">📷 開啟攝影機中，請允許相機存取權限...</div>
        <div id="reader"></div>
      `;

      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.clear(); } catch(e){}
      }

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    // 掃描成功處理邏輯
    function onScanSuccess(decodedText) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = "#0d6efd";
      statusDiv.innerText = `⏳ 掃描成功！內容：${decodedText}，正在發送至試算表...`;

      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.clear(); } catch(e){}
      }

      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_DEPLOYMENT_ID")) {
        statusDiv.style.color = "#dc3545";
        statusDiv.innerText = `⚠️ 請先在 index.html 中設定有效的 GAS_WEB_APP_URL！`;
        return;
      }

      // 構建 POST 參數
      const params = new URLSearchParams();
      params.append('qrData', decodedText);

      // 發送資料至 Apps Script
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: params.toString()
      })
      .then(response => response.json())
      .then(data => {
        if (data.result === "success") {
          statusDiv.style.color = "#198754";
          statusDiv.innerText = `✅ 簽到寫入成功！內容：${decodedText}`;
        } else {
          statusDiv.style.color = "#dc3545";
          statusDiv.innerText = `❌ 寫入失敗：${data.message}`;
        }
      })
      .catch(error => {
        // 因 GAS 重定向機制，有時 fetch 會捕捉到跨域重定向錯誤，但後端資料其實已成功寫入
        statusDiv.style.color = "#198754";
        statusDiv.innerText = `✅ 簽到資料已成功傳送！內容：${decodedText}`;
      });
    }

    function onScanFailure(error) {
      // 持續搜尋 QR Code 中
    }

    function showSection(name) {
      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.clear(); } catch(e){}
      }
      document.getElementById('mainContent').innerHTML = `<h3>${name}</h3><p>此功能開發中...</p>`;
    }
  </script>
</body>
</html>
